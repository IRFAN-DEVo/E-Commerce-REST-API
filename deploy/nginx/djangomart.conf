# ==============================================================================
# DjangoMart E-Commerce — Production Nginx Reverse Proxy Configuration
# Architecture: Decoupled Vite/React SPA + Django REST Framework Backend
# ==============================================================================

# Rate Limiting Zones (Defined in http block context in nginx.conf)
# limit_req_zone $binary_remote_addr zone=api_general:10m rate=25r/s;
# limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

upstream django_backend {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# HTTP (Port 80) — Redirect all traffic to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name djangomart.com www.djangomart.com staging.djangomart.com;

    # Allow Let's Encrypt ACME challenge before redirecting
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443) — Primary Production Server Block
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name djangomart.com www.djangomart.com staging.djangomart.com;

    # SSL / TLS Termination
    ssl_certificate /etc/letsencrypt/live/djangomart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/djangomart.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Core Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Request Size Limits (allow up to 25M for product CSV/Excel imports and images)
    client_max_body_size 25M;

    # --------------------------------------------------------------------------
    # Security Rule: Block hidden files (.git, .env, .htaccess, etc.)
    # --------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # Security Rule: Block sensitive source, backup, and environment files
    # --------------------------------------------------------------------------
    location ~* \.(py|pyc|sql|sqlite3|env|bak|log|sh|ini|conf|dockerfile|yml|yaml)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # 1. Django API Endpoints (/api/ and /api/v1/)
    # Proxied strictly to Django. Unknown endpoints return Django's 404 JSON,
    # never falling through to React HTML.
    # --------------------------------------------------------------------------
    location /api/ {
        # Optional rate limiting (with generous burst so checkout/browsing isn't dropped)
        # limit_req zone=api_general burst=50 nodelay;

        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Timeouts for batch import/export operations
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Dedicated Rate Limiting on Authentication Endpoints
    location ~ ^/api/v1/accounts/(login|register|forgot-password)/ {
        # limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --------------------------------------------------------------------------
    # 2. React Admin SPA Routes Direct Navigation & Browser Refresh Handling
    # React Router routes /admin/dashboard, /admin/orders, and /admin/products
    # must resolve to the SPA entry point (index.html).
    # Regex match takes precedence over prefix block for /admin/ to prevent
    # route conflicts.
    # --------------------------------------------------------------------------
    location ~ ^/admin/(dashboard|orders|products)/?$ {
        root /var/www/djangomart/frontend/dist;
        index index.html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --------------------------------------------------------------------------
    # 3. Django Built-in Admin Interface (/admin/)
    # Exact redirect for /admin (without trailing slash) to Django admin.
    # --------------------------------------------------------------------------
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --------------------------------------------------------------------------
    # 4. Legacy Django HTML Admin Tools (/admin-panel/)
    # --------------------------------------------------------------------------
    location /admin-panel/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --------------------------------------------------------------------------
    # 5. Django Static Files (/static/)
    # Collected via python manage.py collectstatic
    # ^~ prevents regex evaluation for static files
    # --------------------------------------------------------------------------
    location ^~ /static/ {
        alias /var/www/djangomart/src/commerce/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 6. User Uploaded Media Files (/media/)
    # Explicit MIME whitelist, CSP headers, and script execution prevention
    # --------------------------------------------------------------------------
    location ^~ /media/ {
        alias /var/www/djangomart/src/commerce/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self';" always;
        access_log off;

        # Whitelist safe media types (including mp4/webm for ProductVideo model)
        types {
            text/plain txt;
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            image/gif gif;
            video/mp4 mp4;
            video/webm webm;
            application/pdf pdf;
        }

        # Explicitly block execution or download of script/html types in media
        location ~* \.(php|py|sh|cgi|pl|exe|bat|cmd|phtml|htm|html|svg)$ {
            deny all;
        }
    }

    # --------------------------------------------------------------------------
    # 7. React SPA Static Assets (/assets/) — Immutable Vite Bundles
    # ^~ prevents regex evaluation for hashed assets
    # --------------------------------------------------------------------------
    location ^~ /assets/ {
        root /var/www/djangomart/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 8. React SPA Customer Pages & Direct Navigation Fallback
    # Handles: /, /products, /products/*, /cart, /checkout, /orders, /orders/*,
    # /login, /register, /forgot-password, /reset-password, /profile, /wishlist,
    # /notifications.
    # --------------------------------------------------------------------------
    location / {
        root /var/www/djangomart/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Disable cache for index.html so frontend deployments take effect immediately
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
